<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Admin Portal Login | Besim Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-wrapper">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">BESIM DESIGN</div>
      <div class="login-sub">Commercial Architecture • Admin Portal</div>
    </div>

    <form id="loginForm" novalidate>
      <div id="loginAlert" style="display: none; padding: 12px 14px; background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.85rem; border-radius: 4px; margin-bottom: 20px;"></div>

      <div class="form-group">
        <label class="form-label" for="adminEmail">User ID / Email</label>
        <input type="text" id="adminEmail" name="email" class="form-control" placeholder="Enter User ID or Email" required autocomplete="username">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="adminPassword" style="margin-bottom: 0;">Security Password</label>
          <button type="button" id="btnTogglePassword" style="background: none; border: none; color: var(--gold, #c5a880); font-size: 0.75rem; cursor: pointer; padding: 0 4px; text-decoration: underline;">
            Show Password
          </button>
        </div>
        <input type="password" id="adminPassword" name="password" class="form-control" placeholder="Enter Password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-gold" id="btnLoginSubmit" style="width: 100%; justify-content: center; margin-top: 10px;">
        <span id="btnLoginText">Authenticate Session 🔒</span>
        <span id="btnLoginSpinner" style="display: none;">Verifying...</span>
      </button>

      <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-dim);">
        Protected by IP rate-limiting & JWT session tokens.
        <br>
        <a href="/" style="color: var(--gold); text-decoration: underline; margin-top: 8px; display: inline-block;">← Return to Main Studio Website</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const btnSubmit = document.getElementById('btnLoginSubmit');
    const btnText = document.getElementById('btnLoginText');
    const btnSpinner = document.getElementById('btnLoginSpinner');
    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const passwordInput = document.getElementById('adminPassword');

    if (btnTogglePassword && passwordInput) {
      btnTogglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          btnTogglePassword.textContent = 'Hide Password';
        } else {
          passwordInput.type = 'password';
          btnTogglePassword.textContent = 'Show Password';
        }
      });
    }

    // Check URL parameters for gentle status banners
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('session_expired') === '1' || urlParams.get('expired') === '1') {
      alertBox.textContent = 'Your administrator session has ended. Please sign in again to continue.';
      alertBox.style.background = 'rgba(234, 179, 8, 0.15)';
      alertBox.style.borderColor = '#eab308';
      alertBox.style.color = '#fde047';
      alertBox.style.display = 'block';
    } else if (urlParams.get('logged_out') === '1') {
      alertBox.textContent = 'You have logged out successfully.';
      alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
      alertBox.style.borderColor = '#10b981';
      alertBox.style.color = '#6ee7b7';
      alertBox.style.display = 'block';
    }

    // Check if valid session is already active (unless arriving from an explicit logout/expiration)
    const isExplicitExit = urlParams.get('session_expired') === '1' || urlParams.get('expired') === '1' || urlParams.get('logged_out') === '1';
    let savedToken = null;
    try {
      savedToken = localStorage.getItem('besim_admin_token') || sessionStorage.getItem('besim_admin_token');
    } catch (_) {}

    if (savedToken && !isExplicitExit) {
      fetch(`/api/auth/me?auth_token=${encodeURIComponent(savedToken)}`, {
        headers: { 'Authorization': `Bearer ${savedToken}` },
      })
        .then(r => r.json())
        .then(d => {
          if (d.success && d.admin) {
            const redirectParams = new URLSearchParams(window.location.search);
            if (savedToken) redirectParams.set('auth_token', savedToken);
            if (!redirectParams.get('tab')) {
              const hashTab = window.location.hash.replace('#', '');
              if (hashTab) redirectParams.set('tab', hashTab);
            }
            const redirectUrl = `/admin/dashboard.html?${redirectParams.toString()}`;
            window.location.replace(redirectUrl);
          } else {
            try {
              localStorage.removeItem('besim_admin_token');
              localStorage.removeItem('besim_admin_email');
              sessionStorage.removeItem('besim_admin_token');
            } catch (_) {}
          }
        })
        .catch(() => {});
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both User ID and password.';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.borderColor = '#ef4444';
        alertBox.style.color = '#fca5a5';
        alertBox.style.display = 'block';
        return;
      }

      btnSubmit.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';

      try {
        let res;
        const targetUrl = '/api/auth/login';
        const payload = JSON.stringify({ email, password });

        // Resilient fetch strategy for standard browser and cross-origin iframes
        try {
          res = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: payload,
          });
        } catch (fetchErr1) {
          console.warn('Attempt 1 (same-origin credentials) failed, retrying without credentials:', fetchErr1);
          try {
            res = await fetch(targetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload,
            });
          } catch (fetchErr2) {
            console.warn('Attempt 2 (relative URL) failed, retrying with window origin:', fetchErr2);
            res = await fetch(window.location.origin + targetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload,
            });
          }
        }

        const text = await res.text();
        let data = {};
        let isJson = false;
        try {
          data = JSON.parse(text);
          isJson = true;
        } catch (_) {
          isJson = false;
        }

        if (res.ok && isJson && data.success) {
          // Persist token in localStorage, sessionStorage, and client cookie for total iframe resiliency
          if (data.token) {
            try {
              localStorage.setItem('besim_admin_token', data.token);
              sessionStorage.setItem('besim_admin_token', data.token);
              document.cookie = `token=${data.token}; path=/; max-age=604800; SameSite=Lax`;
            } catch (_) {}
          }
          if (data.admin && data.admin.email) {
            try {
              localStorage.setItem('besim_admin_email', data.admin.email);
            } catch (_) {}
          }

          alertBox.textContent = '✓ Session authenticated! Loading admin dashboard...';
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.borderColor = '#10b981';
          alertBox.style.color = '#6ee7b7';
          alertBox.style.display = 'block';

          const redirectParams = new URLSearchParams(window.location.search);
          if (data.token) redirectParams.set('auth_token', data.token);
          if (!redirectParams.get('tab')) {
            const hashTab = window.location.hash.replace('#', '');
            if (hashTab) redirectParams.set('tab', hashTab);
          }
          const dest = `/admin/dashboard.html?${redirectParams.toString()}`;
          setTimeout(() => {
            window.location.replace(dest);
          }, 200);
        } else {
          let errorMsg = data.message;
          if (!errorMsg) {
            if (res.status === 401) {
              errorMsg = 'Invalid administrator credentials.';
            } else if (res.status === 404) {
              errorMsg = 'Backend API is currently offline on this host (/api/auth/login 404).';
            } else if (res.status === 502 || res.status === 503) {
              errorMsg = 'Server is currently restarting. Please wait 5 seconds and retry.';
            } else {
              errorMsg = 'Invalid credentials or server unavailable.';
            }
          }
          alertBox.textContent = errorMsg;
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.borderColor = '#ef4444';
          alertBox.style.color = '#fca5a5';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        console.error('Admin login error:', err);
        alertBox.innerHTML = `${err.message || 'Network communication error.'} <a href="/admin/login.html?t=${Date.now()}" style="color: #fff; text-decoration: underline; margin-left: 8px;">Refresh Login</a>`;
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.borderColor = '#ef4444';
        alertBox.style.color = '#fca5a5';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>

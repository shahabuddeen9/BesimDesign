<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Portal Login | Besim Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-wrapper">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">BESIM DESIGN</div>
      <div class="login-sub">Commercial Architecture • Admin Portal</div>
    </div>

    <form id="loginForm" novalidate>
      <div id="loginAlert" style="display: none; padding: 12px 14px; background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.85rem; border-radius: 4px; margin-bottom: 20px;"></div>

      <div style="background: rgba(197, 168, 128, 0.1); border: 1px solid rgba(197, 168, 128, 0.3); border-radius: 6px; padding: 14px; margin-bottom: 20px; font-size: 0.82rem; color: #f1f5f9;">
        <div style="font-weight: 600; color: var(--gold); margin-bottom: 6px;">Admin Portal Access Credentials:</div>
        <div>Email: <strong style="color: #fff;">besimdesigne@gmail.com</strong> <span style="color: var(--text-dim); font-size: 0.75rem;">(or admin@besimdesign.com)</span></div>
        <div>Password: <strong style="color: #fff;">Admin@2025!</strong></div>
        <button type="button" id="btnQuickDemoLogin" style="margin-top: 10px; width: 100%; background: rgba(197,168,128,0.25); border: 1px solid var(--gold); color: #fff; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 0.82rem; font-weight: 500;">
          ⚡ Quick 1-Click Admin Login
        </button>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminEmail">Administrator Email</label>
        <input type="email" id="adminEmail" name="email" class="form-control" placeholder="admin@besimdesign.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Security Password</label>
        <input type="password" id="adminPassword" name="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-gold" id="btnLoginSubmit" style="width: 100%; justify-content: center; margin-top: 10px;">
        <span id="btnLoginText">Authenticate Session 🔒</span>
        <span id="btnLoginSpinner" style="display: none;">Verifying...</span>
      </button>

      <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-dim);">
        Protected by IP rate-limiting & JWT httpOnly sessions.
        <br>
        <a href="/" style="color: var(--gold); text-decoration: underline; margin-top: 8px; display: inline-block;">← Return to Main Studio Website</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const btnSubmit = document.getElementById('btnLoginSubmit');
    const btnText = document.getElementById('btnLoginText');
    const btnSpinner = document.getElementById('btnLoginSpinner');
    const btnQuick = document.getElementById('btnQuickDemoLogin');

    // Check URL parameters for gentle status banners
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('session_expired') === '1' || urlParams.get('expired') === '1') {
      alertBox.textContent = 'Your administrator session has ended. Please sign in again to continue.';
      alertBox.style.background = 'rgba(234, 179, 8, 0.15)';
      alertBox.style.borderColor = '#eab308';
      alertBox.style.color = '#fde047';
      alertBox.style.display = 'block';
    } else if (urlParams.get('logged_out') === '1') {
      alertBox.textContent = 'You have logged out successfully.';
      alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
      alertBox.style.borderColor = '#10b981';
      alertBox.style.color = '#6ee7b7';
      alertBox.style.display = 'block';
    }

    // Check if valid session is already active
    const savedToken = localStorage.getItem('besim_admin_token');
    if (savedToken) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${savedToken}` },
        credentials: 'include'
      })
        .then(r => r.json())
        .then(d => {
          if (d.success && d.admin) {
            const tab = urlParams.get('tab') || window.location.hash.replace('#', '');
            window.location.replace(tab ? `/admin/dashboard.html?tab=${tab}` : '/admin/dashboard.html');
          } else {
            localStorage.removeItem('besim_admin_token');
            localStorage.removeItem('besim_admin_email');
          }
        })
        .catch(() => {});
    }

    if (btnQuick) {
      btnQuick.addEventListener('click', () => {
        document.getElementById('adminEmail').value = 'admin@besimdesign.com';
        document.getElementById('adminPassword').value = 'Admin@2025!';
        form.dispatchEvent(new Event('submit'));
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both administrator email and password.';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.borderColor = '#ef4444';
        alertBox.style.color = '#fca5a5';
        alertBox.style.display = 'block';
        return;
      }

      btnSubmit.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Store token in localStorage for reliable iframe and bearer authorization
          if (data.token) {
            localStorage.setItem('besim_admin_token', data.token);
          }
          if (data.admin && data.admin.email) {
            localStorage.setItem('besim_admin_email', data.admin.email);
          }

          alertBox.textContent = '✓ Session authenticated! Loading admin dashboard...';
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.borderColor = '#10b981';
          alertBox.style.color = '#6ee7b7';
          alertBox.style.display = 'block';

          const tab = urlParams.get('tab') || window.location.hash.replace('#', '');
          setTimeout(() => {
            window.location.replace(tab ? `/admin/dashboard.html?tab=${tab}` : '/admin/dashboard.html');
          }, 350);
        } else {
          alertBox.textContent = data.message || 'Invalid administrator credentials.';
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.borderColor = '#ef4444';
          alertBox.style.color = '#fca5a5';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Network or server communication error. Please try again.';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.borderColor = '#ef4444';
        alertBox.style.color = '#fca5a5';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
